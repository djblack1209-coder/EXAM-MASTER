<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="title desc">
<title id="title">EXAM-MASTER — 从资料到复习，把 AI 接入学习闭环</title>
<desc id="desc">公开作品展示。Vue 3、TypeScript、Python、FSRS。资料处理、证据核验、答题反馈、间隔复习四个环节。</desc>
<defs>
  <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#112d27"/><stop offset="1" stop-color="#071b19"/></linearGradient>
  <linearGradient id="accent"><stop stop-color="#bdff86"/><stop offset="1" stop-color="#70e0dd"/></linearGradient>
  <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse"><path d="M48 0H0V48" fill="none" stroke="#b7eace" stroke-opacity=".05"/></pattern>
</defs>
<rect width="1280" height="640" rx="24" fill="url(#bg)"/>
<rect width="1280" height="640" rx="24" fill="url(#grid)"/>
<circle cx="1200" cy="45" r="250" fill="#69e8b1" opacity=".035"/>
<g font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,PingFang SC,Microsoft YaHei,sans-serif">
  <rect x="64" y="58" width="44" height="44" rx="12" fill="url(#accent)"/>
