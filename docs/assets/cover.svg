    <g fill="#122f27" stroke="#385b49"><rect width="454" height="72" rx="16"/><rect y="94" width="454" height="72" rx="16"/><rect y="188" width="454" height="72" rx="16"/><rect y="282" width="454" height="72" rx="16"/></g>
