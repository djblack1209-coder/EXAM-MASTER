  <text x="60" y="352" font-size="60" font-weight="750" fill="url(#accent)">把 AI 接入学习闭环</text>
  <text x="64" y="411" font-size="21" fill="#b4cbbf">资料结构化 · 答案证据核验 · 自适应复习</text>
