name: 讨论改进 / Feature discussion
description: 讨论使用场景、AI 工作流或工程取舍
title: "[Idea] "
body:
  - type: textarea
    id: problem
    attributes:
      label: 想解决什么问题？
      description: 请描述具体使用场景。
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 改进建议与验收方式
      description: 什么结果能说明这个改进有效？
    validations:
      required: true
