version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '04:00'
      timezone: Etc/UTC
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
    # Runtime stays on Node 22 LTS; see docs/13-DEVELOPMENT-PLAN.md (Dependabot 分流).
    ignore:
      - dependency-name: '@types/node'
        update-types: [version-update:semver-major]
    versioning-strategy: increase
    commit-message:
      prefix: chore
      include: scope
    groups:
      uni-framework:
        patterns: ['@dcloudio/*', '@vitejs/*', 'vue', 'pinia', 'vite', 'vite-plugin-*']
        update-types: [minor, patch]
      testing:
        patterns: ['vitest', '@vitest/*', '@vue/test-utils', 'happy-dom']
        update-types: [minor, patch]
      tooling:
        patterns: ['*']
        exclude-patterns:
          [
            '@dcloudio/*',
            '@vitejs/*',
            'vue',
            'pinia',
            'vite',
            'vite-plugin-*',
            'vitest',
            '@vitest/*',
            '@vue/test-utils',
            'happy-dom'
          ]
        update-types: [minor, patch]
  - package-ecosystem: npm
    directories: ['/laf-backend', '/laf-backend/standalone']
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
    # Node 22 LTS types stay aligned with the runtime (docs/13-DEVELOPMENT-PLAN.md).
    # Other majors wait for the backend migration batches and their acceptance gates there.
    ignore:
      - dependency-name: '@types/node'
        update-types: [version-update:semver-major]
      - dependency-name: express
        update-types: [version-update:semver-major]
      - dependency-name: '@types/express'
        update-types: [version-update:semver-major]
      - dependency-name: mongodb
        update-types: [version-update:semver-major]
      - dependency-name: typescript
        update-types: [version-update:semver-major]
    groups:
      backend-compatible:
        patterns: ['*']
        update-types: [minor, patch]
    commit-message:
      prefix: chore
      include: scope
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    cooldown:
      default-days: 7
    groups:
      material-tools:
        patterns: ['*']
        update-types: [minor, patch]
    commit-message:
      prefix: chore
      include: scope
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    groups:
      workflow-actions:
        patterns: ['*']
    commit-message:
      prefix: chore
      include: scope
  - package-ecosystem: docker
    directory: /deploy/tencent
    # Pin Node 22 LTS; Node 25 is not LTS (docs/13-DEVELOPMENT-PLAN.md).
    ignore:
      - dependency-name: node
        update-types: [version-update:semver-major]
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    commit-message:
      prefix: chore
      include: scope
