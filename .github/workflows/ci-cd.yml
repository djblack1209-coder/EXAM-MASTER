# ============================================
# Yozi AI 前端 CI/CD 流水线
# 触发条件：push 到 main/develop，PR 到 main
# 后端源码仍在本仓库；生产部署与本地质量检查分别验收。
# ============================================
name: Project Quality and Builds

permissions:
  contents: read

on:
  push:
    branches:
      - main
      - develop
    paths-ignore:
      - '**.md'
      - 'docs/**'
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]

# 同一分支/PR 的新提交自动取消旧的运行
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  NODE_VERSION: '22.22.3'
  LAF_SOURCE_AUDIT_STRICT: 'true'

jobs:
  # ==================== 代码质量检查 ====================
  lint-and-test:
    name: Lint & Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Verify runtime
        run: |
          node -v
          npm -v
          node -e "const c=require('node:crypto'); if (typeof c.hash !== 'function') { console.error('crypto.hash is unavailable, require Node.js >= 20.12'); process.exit(1); }"

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Run Laf source audit
        run: |
          if [ "${LAF_SOURCE_AUDIT_STRICT}" = "true" ]; then
            npm run audit:laf:function-sources -- --strict
          else
            npm run audit:laf:function-sources
          fi

      # husky prepare 在 CI 中不需要，跳过 prepare 脚本
      - name: Run ESLint
        run: npm run lint
        timeout-minutes: 5

      - name: Verify formatting and repository references
        run: |
          npm run format:check
          npm run audit:repository
          npm run audit:subpkg-sync

      - name: Verify scripts and tests
        run: npm run lint:tooling

      - name: Verify standalone backend
        run: |
          npm ci --ignore-scripts --prefix laf-backend/standalone
          npm run typecheck:backend
          npm run build:backend
          npm run audit:backend:runtime

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Verify Python code
        run: |
          python -m pip install -r requirements-dev.txt
          npm run lint:python

      - name: Run unit and component tests
        run: npm test -- --exclude tests/unit/mobile-viewport-smoke.spec.js
        timeout-minutes: 8

      - name: Install matching mobile smoke browser
        run: npx --no-install playwright install --with-deps --only-shell chromium
        timeout-minutes: 2

      # Real browser work runs after the unit worker pool has exited. Local npm
      # test still includes this file; neither step retries or skips its cases.
      - name: Run mobile viewport browser smoke tests
        run: npm test -- --maxWorkers=1 tests/unit/mobile-viewport-smoke.spec.js
        timeout-minutes: 2

      - name: Verify learning calendar, retests and backups across timezones
        timeout-minutes: 4
        run: |
          for timezone in Asia/Shanghai America/New_York America/Los_Angeles; do
            TZ="$timezone" npm test -- --maxWorkers=1 \
              tests/unit/learning-calendar.spec.js \
              tests/unit/learning-discussion-writing.spec.js \
              tests/unit/learning-email-writing.spec.js \
              tests/unit/learning-sentence-building.spec.js \
              tests/unit/learning-vocabulary.spec.js \
              tests/unit/learning-backup.spec.js
          done

      - name: Build check
        run: npm run build:h5
        timeout-minutes: 10

      # 上传构建产物供后续 job 使用，避免重复构建
      - name: Upload build artifacts
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v7.0.2
        with:
          name: h5-build
          path: dist/build/h5
          retention-days: 1

  # ==================== 安全扫描（与 lint-and-test 并行） ====================
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    # 与 lint-and-test 并行执行，结果不阻断构建（但会产生可见告警）
    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies for audit
        run: npm ci --ignore-scripts

      # npm audit: 发现 critical 和扫描器故障分别提示，均不阻断。
      - name: Run npm audit
        id: npm-audit
        continue-on-error: true
        run: |
          set +e
          npm audit --audit-level=critical --json > "$RUNNER_TEMP/yozi-npm-audit.json"
          audit_exit=$?
          echo "exit_code=$audit_exit" >> "$GITHUB_OUTPUT"
          exit "$audit_exit"

      - name: Annotate npm audit result
        if: always()
        continue-on-error: true
        env:
          SCAN_OUTCOME: ${{ steps.npm-audit.outcome }}
          AUDIT_EXIT_CODE: ${{ steps.npm-audit.outputs.exit_code }}
        run: node scripts/build/report-security-scan.mjs npm "$RUNNER_TEMP/yozi-npm-audit.json" "$SCAN_OUTCOME" "$AUDIT_EXIT_CODE"

      # 只扫描一次；JSON 留在 runner 临时目录，由本地脚本脱敏渲染。
      - name: Run Trivy vulnerability scanner (filesystem)
        uses: aquasecurity/trivy-action@v0.36.0
        id: trivy
        continue-on-error: true
        env:
          TRIVY_INCLUDE_DEV_DEPS: 'true'
          # pip 默认只识别 requirements.txt；补齐仓库 requirements*.txt。
          TRIVY_FILE_PATTERNS: 'pip:(^|/)requirements[^/]*\.txt$'
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'json'
          output: '${{ runner.temp }}/yozi-trivy.json'
          cache-dir: '${{ runner.temp }}/trivy-cache'
          severity: 'CRITICAL,HIGH'
          # 同时匹配根与任意嵌套目录；保留仓库锁文件、清单和源码。
          skip-dirs: 'node_modules,**/node_modules'
          exit-code: '0'

      - name: Annotate Trivy result
        if: always()
        continue-on-error: true
        env:
          SCAN_OUTCOME: ${{ steps.trivy.outcome }}
        run: node scripts/build/report-security-scan.mjs trivy "$RUNNER_TEMP/yozi-trivy.json" "$SCAN_OUTCOME"

      # 密钥泄露检查（硬性门禁 — 发现泄露必须阻断）
      - name: Run tracked secrets audit
        run: npm run audit:secrets:tracked

      - name: Remove raw scan reports
        if: always()
        continue-on-error: true
        run: rm -f "$RUNNER_TEMP/yozi-npm-audit.json" "$RUNNER_TEMP/yozi-trivy.json"

  # ==================== 部署到 Staging ====================
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: [lint-and-test, security-scan]
    if: github.ref == 'refs/heads/develop' && vars.DEPLOY_ENABLED == 'true'
    environment:
      name: staging
      url: https://staging.245334.xyz
    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1

      - name: Setup kubectl
        uses: azure/setup-kubectl@v5
        with:
          version: 'v1.28.0'

      - name: Configure kubectl
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBE_CONFIG_STAGING }}" | base64 -d > ~/.kube/config

      - name: Lowercase image name
        id: repo
        run: echo "image_name=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

      - name: Deploy frontend to staging
        run: |
          IMAGE_TAG="${GITHUB_SHA::7}"
          kubectl set image deployment/exam-master-frontend \
            frontend=${{ env.REGISTRY }}/${{ steps.repo.outputs.image_name }}-frontend:${IMAGE_TAG} \
            -n exam-master-staging
          kubectl rollout status deployment/exam-master-frontend -n exam-master-staging --timeout=300s

      - name: Run smoke tests
        run: |
          sleep 30
          curl -f https://staging.245334.xyz/health-check || exit 1

  # ==================== 部署到生产 ====================
  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [lint-and-test, security-scan]
    # Tencent is the live production path. This Kubernetes job is retained only
    # for an explicitly approved Sealos cold-recovery exercise.
    if: github.ref == 'refs/heads/main' && vars.DEPLOY_ENABLED == 'true' && vars.PRODUCTION_PLATFORM == 'sealos-cold-recovery'
    environment:
      name: production-cold-recovery
      url: https://nf98ia8qnt.sealosbja.site
    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1

      - name: Setup kubectl
        uses: azure/setup-kubectl@v5
        with:
          version: 'v1.28.0'

      - name: Lowercase image name
        id: repo
        run: echo "image_name=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

      - name: Configure kubectl
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBE_CONFIG_PROD }}" | base64 -d > ~/.kube/config

      - name: Deploy frontend to production
        run: |
          IMAGE_TAG="${GITHUB_SHA::7}"
          kubectl set image deployment/exam-master-frontend \
            frontend=${{ env.REGISTRY }}/${{ steps.repo.outputs.image_name }}-frontend:${IMAGE_TAG} \
            -n exam-master
          kubectl rollout status deployment/exam-master-frontend -n exam-master --timeout=300s

      - name: Verify deployment
        run: |
          kubectl get pods -n exam-master -l app.kubernetes.io/component=frontend
          curl -f https://nf98ia8qnt.sealosbja.site/health-check || exit 1

      - name: Rollback on failure
        if: failure()
        run: |
          echo "Deployment failed, rolling back..."
          kubectl rollout undo deployment/exam-master-frontend -n exam-master
